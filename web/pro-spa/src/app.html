<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#0b0a09" />
		<title>GoalIQ Premium | FPL tools</title>
		<meta
			name="description"
			content="FPL tools from a real match model: player expected points with scoring rate and minutes shown separately, clean sheets, captain ranker and a transfer planner. Graded in public from GW1."
		/>
		<!-- 32/48 lisättiin koska selaimet suosivat välilehtikokoa vastaavaa
		     varianttia; pelkkä 192 skaalattiin alas ja IQ sumeni.
		     29.7 (Villen havainto): nämä olivat yhä MAGENTA-aikakaudelta, koska
		     SPA:lla on omat kopiot static/-kansiossa eikä 28.7. teletext-passi
		     koskenut niitä. goaliq.app näytti amber-merkkiä ja pro.goaliq.app
		     magentaa. Nyt molemmat tulevat samasta gen_teletext_social.py:sta. -->
		<link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/goaliq-appicon-32.png" />
		<link rel="icon" type="image/png" sizes="48x48" href="%sveltekit.assets%/goaliq-appicon-48.png" />
		<link rel="icon" type="image/png" sizes="192x192" href="%sveltekit.assets%/goaliq-appicon-192.png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/goaliq-appicon-192.png" />
		<meta property="og:title" content="GoalIQ Premium | FPL tools" />
		<meta
			property="og:description"
			content="FPL tools from a real match model: player expected points with scoring rate and minutes shown separately, clean sheets, captain ranker and a transfer planner. Graded in public from GW1."
		/>
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://pro.goaliq.app/" />
		<!-- #155-fix: og:image OLI suhteellinen (%sveltekit.assets%) — X/FB-crawlerit
		     vaativat absoluuttisen URLin, ja twitter:card puuttui → tweet-kortti jäi
		     ilman ikonia.
		     28.7: summary → summary_large_image. Villen havainto: X näytti pienen
		     ikonin, ja se oli vieläpä vanhan magenta-aikakauden sovellusikoni, kun
		     goaliq.app-linkit saivat classic-ilmeisen 1200x630-kortin. Kaksi eri
		     korttia samasta tuotteesta on brändivirhe, ja pieni neliö häviää
		     syötteessä isolle kortille. Kuva servataan pro-originista (ei
		     ristiinviittauksena goaliq.appiin), koska osa crawlereista ei seuraa
		     toiselle hostille. -->
		<meta property="og:image" content="https://pro.goaliq.app/goaliq-social-1200x630.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="GoalIQ: free FPL tools backed by a real match model" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:site" content="@goaliqapp" />
		<meta name="twitter:title" content="GoalIQ Premium | FPL tools" />
		<meta
			name="twitter:description"
			content="FPL tools from a real match model: player expected points with scoring rate and minutes shown separately, clean sheets, captain ranker and a transfer planner. Graded in public from GW1."
		/>
		<meta name="twitter:image" content="https://pro.goaliq.app/goaliq-social-1200x630.png" />
		<!-- 2.8 PERF: API ja Supabase avataan valmiiksi, koska molempiin
		     soitetaan heti kun sovellus on kaynnistynyt. Sailyttaa TLS-kattelyn
		     ajan kriittiselta polulta. -->
		<link rel="preconnect" href="https://api.goaliq.app" crossorigin />
		<!-- 4.8.2026: KAYNNISTYSVAHTI. Miksi tama on HTML:ssa eika moduulissa:
		     3.8. shipattu varhaispuskuri (lib/analytics.ts) asennetaan
		     +layout.svelten onMountissa, eli VASTA kun juuri-layoutin chunk on
		     ladattu ja hydraatio onnistunut. Jos juuri sen chunkin import
		     epaonnistuu — tasmalleen se vika joka nahtiin 30.7, 31.7, 2.8 ja
		     4.8 — onMount ei aja koskaan, mikaan ei asenna kuuntelijoita eika
		     mikaan laheta mitaan. Kayttajalle nakyy SvelteKitin oma
		     "500 Internal Error" -sivu 200-dokumentin paalla ja PostHogiin ei
		     tule riviakaan. Toistettu paikallisesti: nodes/0.*.js pois ->
		     sama ruutu, DOM 1404 B (terveena 11533 B).
		     Tama skripti on osa HTML:aa, joten se ajetaan ennen yhtakaan
		     moduulia eika se voi epaonnistua chunkin mukana. -->
		<script>
			(function () {
				var MAX = 10;
				var buf = (window.__goaliqEarlyErrors = []);
				function push(err, kind) {
					if (buf.length < MAX) buf.push({ error: err, kind: kind });
				}
				function onErr(ev) {
					push(ev.error || new Error(ev.message || 'Unknown error'), 'error');
				}
				function onRej(ev) {
					push(ev.reason || new Error('Unhandled rejection'), 'unhandledrejection');
				}
				window.addEventListener('error', onErr);
				window.addEventListener('unhandledrejection', onRej);
				/* Sovellus kutsuu taman heti kun analytics on ottanut vastuun:
				   omat kuuntelijat pois (muuten tuplakirjaus) ja vahti peruutetaan. */
				window.__goaliqEarlyDetach = function () {
					window.removeEventListener('error', onErr);
					window.removeEventListener('unhandledrejection', onRej);
					clearTimeout(timer);
				};
				/* 10 s: hidas mutta onnistunut kaynnistys yli 10 sekunnin on
				   itsessaan signaali jonka haluamme nahda, joten sita ei
				   yriteta suodattaa pois. Vaara positiivinen on halvempi kuin
				   nykytila, jossa taysin kaatunut kaynnistys on nakymaton. */
				var timer = setTimeout(function () {
					var KEY = 'phc_ASmq5P9R5goGTDxze3GkXHJqU6RsvMCNqunSVBMgGkn7';
					var HOST = 'https://us.i.posthog.com';
					var did = null;
					try {
						/* Sama distinct_id kuin posthog-js:lla, jotta tapahtuma
						   liittyy samaan henkiloon eika luo haamuprofiilia. */
						var raw = localStorage.getItem('ph_' + KEY + '_posthog');
						if (raw) did = JSON.parse(raw).distinct_id || null;
					} catch (e) {}
					if (!did) did = 'boot-failsafe-' + Math.random().toString(36).slice(2);
					var first = buf.length ? buf[0].error : null;
					var body = JSON.stringify({
						api_key: KEY,
						event: 'web_boot_failed',
						properties: {
							distinct_id: did,
							$current_url: location.href,
							source: 'boot_failsafe',
							error_count: buf.length,
							first_error: first ? String((first && first.message) || first) : null,
							first_error_kind: buf.length ? buf[0].kind : null,
							/* Erottaa kaksi vikaa (mitattu, ei paateltu):
							   false = SvelteKitin runtime eli ja ehti korvata
							   rungon omalla virhesivullaan (nodes/*-chunk
							   kaatui); true = runtime ei kaynnistynyt
							   lainkaan, esim. entry-chunk jai saamatta. */
							boot_shell_present: !!document.getElementById('boot'),
							ready_state: document.readyState
						}
					});
					try {
						var blob = new Blob([body], { type: 'application/json' });
						if (!navigator.sendBeacon || !navigator.sendBeacon(HOST + '/e/', blob)) {
							fetch(HOST + '/e/', {
								method: 'POST',
								body: body,
								keepalive: true,
								mode: 'no-cors',
								headers: { 'Content-Type': 'application/json' }
							});
						}
					} catch (e) {}
				}, 10000);
			})();
		</script>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<!-- 26.7 PERF: preload+onload, ei render-blocking stylesheetiä (sama
		     kaava kuin goaliq.app-sivuilla). noscript = varmistus. -->
		<link
			rel="preload"
			as="style"
			href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap"
			onload="this.rel='stylesheet'"
		/>
		<noscript>
			<link
				href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap"
				rel="stylesheet"
			/>
		</noscript>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<!-- 2.8 PERF: kuori on 5,5 kB ja sovellus 736 kB JS:aa, joten ilman tata
		     ruutu oli TYHJA koko latauksen ajan. Tama runko on osa HTML:aa eli
		     maalautuu heti ensimmaisesta tavusta. +layout poistaa sen mountissa.
		     Tarkoituksella pelkka kehys, EI valeskeleton datalle jota ei viela
		     ole: tyhja rivi joka tayttyy on rehellinen, valeluku ei olisi. -->
		<div id="boot" aria-hidden="true">
			<div class="boot-bar">GoalIQ Premium</div>
			<div class="boot-lines"><i></i><i></i><i></i></div>
		</div>
		<style>
			#boot {
				font-family: 'IBM Plex Mono', ui-monospace, monospace;
				max-width: 960px;
				margin: 0 auto;
				padding: 16px;
			}
			#boot .boot-bar {
				background: #f3f2f2;
				color: #0b0a09;
				font-size: 11.5px;
				text-transform: uppercase;
				letter-spacing: 0.16em;
				padding: 6px 10px;
			}
			#boot .boot-lines {
				display: grid;
				gap: 8px;
				margin-top: 12px;
			}
			#boot .boot-lines i {
				display: block;
				height: 14px;
				background: #1f1d1a;
			}
			#boot .boot-lines i:nth-child(2) {
				width: 72%;
			}
			#boot .boot-lines i:nth-child(3) {
				width: 45%;
			}
		</style>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
