<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GoalIQ – Returning to app</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" onload="this.rel='stylesheet'">
<noscript><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>
  <meta name="theme-color" content="#0B0A09">
  <style>
    /* Redesign 24.7: brand-tokens + Space Grotesk + tumma ink-header ja magenta-bar
       (sama kieli kuin fpl.html/index.html). */
    :root {
      --magenta: #FF2E7E;
      --magenta-deep: #2ED6C2;
      --ink: #F3F2F2;
      --ink2: #141311;
      --cream: #0B0A09;
      --muted: #A8A29A;
    }
    * { box-sizing: border-box; }
    html, body { overflow-x: clip; }
    body {
      margin: 0;
      background: var(--cream);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }
    h1, .brand { font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
    .site-header { background: var(--cream); color: var(--ink); }
    .bar { height:1px;background:var(--line); }
    .nav {
      max-width: 960px; margin: 0 auto; padding: 16px 20px; width: 100%;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .brand { font-size: 20px; font-weight: 800; letter-spacing: .5px; }
    .brand a { color: var(--ink); text-decoration: none; display: inline-flex; align-items: center; gap:0; }
    .brand-icon { margin-right:10px; width: 32px; height: 32px; border-radius: 9px; display: block; }
    .brand span { color: var(--magenta); }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 24px;
      text-align: center;
    }
    h1 {
      color: var(--ink);
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0 0 8px;
    }
    p { color: var(--muted); font-size: 14px; line-height: 1.5; margin: 4px 0; }
    /* 26.7 CLASSIC: magentatayttö -> gold outline (sivuston CTA-konventio). */
    main a {
      display: inline-block;
      margin-top: 24px;
      padding: 12px 24px;
      background: transparent;
      color: var(--gold-deep,#F5C542);
      border: 1px solid var(--gold,#F5C542);
      text-decoration: none;
      border-radius: 0;
      font-weight: 700;
    }
    main a:hover { background: rgba(245,197,66,0.14); }
  </style>
<link rel="icon" href="/favicon.ico" sizes="any">
</head>
<body>
  <header class="site-header">
    <div class="bar"></div>
    <div class="nav">
      <div class="brand"><a href="./"><svg class="brand-icon" width="32" height="32" viewBox="0 0 44 44" role="img" aria-label="GoalIQ" focusable="false"><rect x="0" y="0" width="44" height="44" fill="#F5C542"/><text x="22" y="30" text-anchor="middle" font-family="IBM Plex Mono,ui-monospace,Consolas,monospace" font-size="20" font-weight="700" letter-spacing="-0.5" fill="#0B0A09">IQ</text></svg>Goal<span>IQ</span></a></div>
    </div>
  </header>

  <main>
    <h1>GoalIQ</h1>
    <p>Returning you to the app...</p>
    <p>If nothing happens, tap the button below.</p>
    <a href="goaliq://subscription-managed">Open GoalIQ</a>
  </main>

  <script>
    // Auto-redirect to the app via deep link
    window.location.href = "goaliq://subscription-managed";
  </script>
</body>
</html>
