<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GoalIQ – Returning to app</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Lora:wght@400;500;600;700&display=swap" onload="this.rel='stylesheet'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Lora:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>
  <meta name="theme-color" content="#F3F2F2">
  <style>
    /* Redesign 24.7: brand-tokens + Space Grotesk + tumma ink-header ja magenta-bar
       (sama kieli kuin fpl.html/index.html). */
    :root {
      --magenta: #FF2E7E;
      --magenta-deep: #C4005F;
      --ink: #201F1D;
      --ink2: #140F1E;
      --cream: #F3F2F2;
      --muted: #5C574F;
    }
    * { box-sizing: border-box; }
    html, body { overflow-x: clip; }
    body {
      margin: 0;
      background: var(--cream);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }
    h1, .brand { font-family:"Cormorant Garamond",Georgia,serif; }
    .site-header { background: var(--cream); color: var(--ink); }
    .bar { height:1px;background:var(--line); }
    .nav {
      max-width: 960px; margin: 0 auto; padding: 16px 20px; width: 100%;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .brand { font-size: 20px; font-weight: 800; letter-spacing: .5px; }
    .brand a { color: var(--ink); text-decoration: none; display: inline-flex; align-items: center; gap: 10px; }
    .brand-icon { width: 32px; height: 32px; border-radius: 9px; display: block; }
    .brand span { color: var(--magenta); }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 24px;
      text-align: center;
    }
    h1 {
      color: var(--ink);
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0 0 8px;
    }
    p { color: var(--muted); font-size: 14px; line-height: 1.5; margin: 4px 0; }
    /* 26.7 CLASSIC: magentatayttö -> gold outline (sivuston CTA-konventio). */
    main a {
      display: inline-block;
      margin-top: 24px;
      padding: 12px 24px;
      background: transparent;
      color: var(--gold-deep,#8C6428);
      border: 1px solid var(--gold,#B68235);
      text-decoration: none;
      border-radius: 999px;
      font-weight: 700;
    }
    main a:hover { background: rgba(182,130,53,0.08); }
  </style>
<link rel="icon" href="/favicon.ico" sizes="any">
</head>
<body>
  <header class="site-header">
    <div class="bar"></div>
    <div class="nav">
      <div class="brand"><a href="./"><img class="brand-icon" src="assets/brand/goaliq-appicon-192.png" width="32" height="32" alt="">Goal<span>IQ</span></a></div>
    </div>
  </header>

  <main>
    <h1>GoalIQ</h1>
    <p>Returning you to the app...</p>
    <p>If nothing happens, tap the button below.</p>
    <a href="goaliq://subscription-managed">Open GoalIQ</a>
  </main>

  <script>
    // Auto-redirect to the app via deep link
    window.location.href = "goaliq://subscription-managed";
  </script>
</body>
</html>
